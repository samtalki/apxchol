# Build + TEST CI for the library and the CPU bindings. Kept lean and
# path-filtered so it only runs when C++/build/package files change, not on
# doc/chart commits.
#
# Five jobs, each builds AND runs its test suite:
#   library  — GCC 14 and Clang 18, root CMake project, full gtest suite
#   macos    — Apple Clang with Homebrew OpenMP, plus the serial fallback
#   python   — manylinux wheel build + pytest
#   python-macos — native ARM64 wheel + pytest + binary/runtime inspection
#   octave   — mkoctfile MEX + the 6-case Octave test suite
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'python/**'
      - 'octave/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'python/**'
      - 'octave/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library (${{ matrix.name }}, build + ctest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 14
            cc: gcc-14
            cxx: g++-14
          - name: Clang 18
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # g++-14: the core uses C++23 "deducing this" (explicit object
          # parameter), which needs GCC >= 14 — newer than the runner default.
          sudo apt-get install -y g++-14 clang-18 libeigen3-dev \
                                  libomp-18-dev ninja-build
      - name: Configure + build (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                -DCMAKE_C_COMPILER=${{ matrix.cc }}
          cmake --build build -j"$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  python:
    name: python (manylinux wheel + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One Python only (cp312) — same manylinux path as the release wheels, so
      # it catches the old-environment portability breaks ubuntu-latest can't,
      # and runs the package test suite inside the built wheel.
      - name: Build wheel + run pytest
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp312-manylinux_x86_64"
        with:
          package-dir: python

  python-macos:
    name: python (macOS ARM64 wheel + pytest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel + run pytest
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: "cp312-macosx_arm64"
        with:
          package-dir: python
      - name: Inspect wheel
        run: python3 python/tools/check_macos_wheel.py wheelhouse/*.whl

  macos:
    name: macOS (OpenMP + serial)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install eigen libomp ninja
      - name: Build and test with Homebrew OpenMP
        run: |
          cmake -B build-macos -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos
          ctest --test-dir build-macos --output-on-failure
      - name: Build and test without OpenMP
        run: |
          cmake -B build-serial -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DAPXCHOL_ENABLE_OPENMP=OFF
          cmake --build build-serial
          ctest --test-dir build-serial --output-on-failure

  octave:
    name: octave (mkoctfile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # g++-14 for the C++23 core (mkoctfile honors the CXX env var below).
          # octave-dev (not liboctave-dev) provides mkoctfile on Ubuntu 24.04.
          sudo apt-get install -y g++-14 octave octave-dev libeigen3-dev
      - name: Build MEX + run tests
        env:
          CXX: g++-14
        run: |
          cd octave
          ./build.sh
          octave --no-gui --eval "addpath(pwd); run('tests/test_apxchol.m')"
