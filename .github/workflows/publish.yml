# Wheels-only PyPI publishing (no sdist — python/CMakeLists.txt references
# ../src, so the package only builds from a full checkout).
# Trigger: publishing a GitHub release (or manual dispatch to dry-run the build
# job). Uses PyPI Trusted Publishing (OIDC), configured on pypi.org under
# "Publishing" with: owner=AlgOptGroup, repo=apxchol,
# workflow=publish.yml, environment=pypi. No API tokens needed.
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  wheels-linux:
    name: manylinux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  wheels-macos:
    name: macOS ARM64 wheels
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: python
      - name: Inspect wheels
        run: python3 python/tools/check_macos_wheel.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  publish:
    name: upload to PyPI (wheels only)
    needs: [wheels-linux, wheels-macos]
    # workflow_dispatch only dry-runs the wheel jobs; uploads happen on a release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
